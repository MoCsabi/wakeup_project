[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "circle-cli-tool"
requires-python = ">=3.12"
version = "1.0.1"
dependencies = [
    "typer",
    "playwright",
    "keyring",
    "platformdirs",
    "requests"
]

[project.scripts]
circle-cli = "main:app"